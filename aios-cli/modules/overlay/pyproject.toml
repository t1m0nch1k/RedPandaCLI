[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aios-overlay"
version = "0.1.0"
description = "AIOS Overlay — фоновый демон глобальных хоткеев и оверлея в стиле Perplexity Computer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7",
    "keyboard>=0.13.5",
    "mss>=9.0",
    "pillow>=10.0",
    "websockets>=13.0",
    "pydantic>=2.8",
]

[project.scripts]
aios-overlay = "aios_overlay.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["aios_overlay"]
