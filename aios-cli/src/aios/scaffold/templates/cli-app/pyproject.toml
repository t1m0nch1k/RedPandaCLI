[project]
name = "$project_name"
version = "0.1.0"
description = "$description"
authors = [{name = "$author"}]
requires-python = ">=3.10"
dependencies = ["typer", "rich"]

[project.scripts]
$project_name = "$project_name.cli:app"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends._legacy:_Backend"
