name: Release AIOS CLI

on:
  release:
    types: [created]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: aios-cli
            asset_name: aios-cli-linux-amd64.tar.gz
          - os: macos-latest
            artifact_name: aios-cli
            asset_name: aios-cli-darwin-amd64.tar.gz
          - os: windows-latest
            artifact_name: aios-cli.exe
            asset_name: aios-cli-windows-amd64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Build binary with PyInstaller
        run: uv run pyinstaller aios.spec

      - name: Prepare Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist
          tar -czvf ../${{ matrix.asset_name }} ${{ matrix.artifact_name }}

      - name: Prepare Archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path dist\${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./${{ matrix.asset_name }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/octet-stream
